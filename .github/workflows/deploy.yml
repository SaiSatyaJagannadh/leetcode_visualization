name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # `pnpm build` regenerates every trace with python3 before next build,
      # so a solution.py that stops tracing fails the deploy instead of
      # silently shipping the last good JSON.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: /leetcode_visualization
          # distDir moves the static export with it, so `out/` only appears
          # under the default. The .next-build guard exists to protect a local
          # dev server; CI has none.
          NEXT_DIST: .next
      # Pages' Jekyll step would skip _next/; the Actions deploy path doesn't
      # run Jekyll, but this costs nothing and removes the classic 404 mode.
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
